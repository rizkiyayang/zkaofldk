<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.png" />

    <title>Finance Tracker</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ios-ease: cubic-bezier(0.22, 1, 0.36, 1);
        --bg: #0b0f1a;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-soft: rgba(255, 255, 255, 0.02);
        --text-primary: #e5e7eb;
        --text-secondary: rgba(229, 231, 235, 0.6);
        --text-tertiary: rgba(229, 231, 235, 0.4);
        --accent: #2563eb;
        --radius: 14px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        padding: var(--space-4);
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
        letter-spacing: -0.1px;
        overflow-x: hidden;
        max-width: 100%;
      }
      html {
        overflow-x: hidden;
      }
      .app {
        margin: auto;
        width: 100%;
        max-width: 900px;
      }
      .card {
        background: var(--surface-soft);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: var(--space-4);
        width: 100%;
        max-width: 100%;
      }
      .card.primary {
        background: rgba(255, 255, 255, 0.02);
      }
      .card.primary > * + * {
        margin-top: 12px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: var(--space-3);
        margin-top: var(--space-2);
        border-radius: var(--radius);
        border: none;
        background: var(--surface);
        color: var(--text-primary);
        font-family: inherit;
        resize: none;
        transition: transform 0.08s var(--ios-ease);
        font-size: 16px;
      }

      input:focus,
      textarea:focus {
        outline: none;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      input::placeholder,
      textarea::placeholder {
        font-family: inherit;
      }
      button {
        margin-top: var(--space-2);
        padding: var(--space-3);
        border-radius: var(--radius);
        border: none;
        background: transparent;
        color: var(--text-primary);
        opacity: 0.7;
        min-height: 44px;
        transition: opacity 0.2s var(--ios-ease);
      }
      button:hover {
        opacity: 0.85;
      }
      button:active {
        transform: scale(0.97);
      }
      .card.primary button {
        background: var(--accent);
        color: white;
        opacity: 1;
      }
      .history-item {
        padding: 12px 8px;
        margin-bottom: 0;
        border-radius: 0;
        background: transparent;
        border: none;
        line-height: 1.6;
        will-change: transform;
        font-size: 15px;
        color: rgba(229, 231, 235, 0.9);
        overflow: hidden;
        transition:
          background 0.2s,
          transform 0.2s,
          opacity 0.2s;
      }
      /* transaction type colors */
      .history-item.expense {
        background: rgba(239, 68, 68, 0.08);
      }

      .history-item.income {
        background: rgba(37, 99, 235, 0.08);
      }

      .history-item.transfer {
        background: transparent;
      }
      .history-item + .history-item {
        border-top: 1px solid rgba(255, 255, 255, 0.03);
      }
      .history-item.removing {
        opacity: 0;
        transform: scale(0.95) translateY(-10px);
      }
      .history-item .inner {
        transition: transform 0.2s var(--ios-ease);
      }
      .history-item:hover .inner {
        transform: translateY(-2px);
      }

      .history-item:hover {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
      }
      .small {
        font-size: 12px;
        color: var(--text-tertiary);
      }
      .actions button {
        margin-right: 5px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translate(-50%, 10px);
        background: var(--surface);
        color: var(--text-primary);
        padding: 8px 14px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .button-success {
        background: #22c55e !important;
        color: #022c22 !important;
        animation: successPop 0.4s var(--ios-ease);
      }

      .button-success::after {
        content: "✓";
        margin-left: 6px;
      }

      #onboarding {
        transition: opacity 0.4s var(--ios-ease);
      }

      #onboarding.hide {
        opacity: 0;
      }

      .primary {
        outline: 1px solid #38bdf8;
      }
      .secondary {
        opacity: 1;
      }
      #search {
        margin-top: 8px;
        font-size: 16px;
      }
      #dateFilters button {
        flex: 1 1 auto;
        min-width: 0;
        white-space: nowrap;
        padding: 10px 8px;
        font-size: clamp(10px, 2.8vw, 13px);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        text-align: center;
      }
      #dateFilters button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
      }
      input[type="date"] {
        position: relative;
        padding-right: 44px;
        font-size: 16px;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
        width: 24px;
        height: 24px;
      }
      /* make entire field feel clickable */
      #filterDate {
        height: 48px;
      }
      #filterDate:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
      }

      .btn-loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .badge {
        font-size: 13px;
        margin-left: 0;
        color: var(--text-secondary);
        background: transparent;
      }
      .mood-💡,
      .mood-🇯🇵,
      .mood-🔥 {
        background: transparent;
        color: inherit;
      }

      .truncate {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .status {
        font-size: 11px;
        margin-top: 0;
        opacity: 0.6;
      }
      #stats {
        font-size: 13px;
        color: var(--text-secondary);
      }
      /* removed moodButtons styles */
      .history-item b {
        display: block;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.3px;
        margin-bottom: 6px;
      }

      .history-item .small {
        font-size: 14px;
        opacity: 0.8;
      }
      @keyframes successPop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }
      /* actions button style */
      .actions button {
        background: transparent;
        border: none;
        color: var(--text-primary);
        opacity: 0.75;
        padding: 6px 4px;
        flex: 1;
        text-align: center;
        border-radius: 8px;
      }

      .actions button:hover {
        opacity: 1;
      }

      .actions button:last-child {
        color: #f87171;
        background: transparent;
      }

      .actions {
        margin-top: 8px;
        display: flex;
        flex-direction: row;
        gap: 8px;
        opacity: 0.6;
      }
      .history-item:hover .actions {
        opacity: 1;
      }

      #loading {
        text-align: center;
        padding: 16px 0;
        font-size: 13px;
        opacity: 0.6;
      }

      /* subtle background by mood */
      .mood-bg-💡,
      .mood-bg-🇯🇵,
      .mood-bg-🔥 {
        background: transparent;
      }
      .history-item.mood-bg-💡,
      .history-item.mood-bg-🇯🇵,
      .history-item.mood-bg-🔥 {
      }

      .highlight {
        background: rgba(253, 224, 71, 0.3);
        color: #fde047;
        padding: 0 2px;
        border-radius: 3px;
      }
      #moodButtons button:active {
        transform: scale(0.95);
      }

      /* skeleton loading */
      /* Tabs UI */
      #tabs {
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: 12px;
      }

      #tabs .tab {
        flex: 1;
        padding: 10px 0;
        border-radius: 10px;
        font-size: 14px;
        opacity: 0.6;
        background: transparent;
        transition: all 0.2s var(--ios-ease);
      }

      #tabs .tab.active {
        background: var(--accent);
        color: #fff;
        opacity: 1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      /* EDIT MODAL TABS */
      #editTabs {
        background: rgba(255, 255, 255, 0.04);
        padding: 4px;
        border-radius: 12px;
      }

      #editTabs .tab {
        flex: 1;
        padding: 10px 0;
        border-radius: 10px;
        font-size: 14px;
        opacity: 0.6;
        background: transparent;
        transition: all 0.2s var(--ios-ease);
      }

      #editTabs .tab.active {
        background: var(--accent);
        color: #fff;
        opacity: 1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      #tabs .tab:not(.active):hover {
        opacity: 0.8;
      }

      #commonFields,
      #transferFields {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      #walletButtons button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
      }

      #categoryButtons button.active,
      #editCategoryChips button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.05) 25%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.05) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        border-radius: 12px;
      }

      .skeleton-item {
        height: 80px;
        margin-bottom: 10px;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .history-header {
        display: none;
      }

      .history-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      #topStats {
        font-size: 12px;
        opacity: 0.6;
      }
      .card.secondary h2 {
        margin-bottom: 4px;
      }

      .history-title-row h2 {
        margin: 0;
      }

      .history-info {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .history-info .status {
        white-space: normal;
        line-height: 1.4;
      }

      .history-chart {
        width: 80px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card.secondary {
        background: transparent;
        border: none;
        opacity: 0.85;
      }
      .history-chart canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      @media (max-width: 600px) {
        .history-header {
          flex-direction: column;
          align-items: stretch;
        }
        .history-title-row {
          flex-direction: row;
          align-items: center;
          gap: 8px;
        }
        .history-chart {
          width: 90px;
          height: 36px;
        }
      }
      #modal > div {
        transform: scale(0.95);
        opacity: 0;
        animation: modalIn 0.2s var(--ios-ease) forwards;

        width: 100%;
        max-width: calc(100% - 32px); /* padding compensation */
        margin: 0 auto;
      }

      @keyframes modalIn {
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      body.typing .card.secondary {
        opacity: 0.4;
      }
      h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      /* .history-header::after removed, replaced by border-bottom */
      input::placeholder,
      textarea::placeholder {
        opacity: 0.4;
      }
      #sortBtn:hover {
        opacity: 0.8;
      }
      #editMoodButtons .edit-mood-btn {
        flex: 1;
        padding: 12px;
        font-size: 18px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s var(--ios-ease);
      }
      #editMoodButtons .edit-mood-btn.active {
        background: var(--accent);
        color: white;
        transform: scale(1.03);
      }
      #editMoodButtons .edit-mood-btn:active {
        transform: scale(0.95);
      }
      #dateFilters {
        overflow-x: hidden;
        flex-wrap: wrap;
      }
      #sortBtn {
        flex: 1 1 100%;
        text-align: center;
        margin-top: 6px;
      }

      body,
      html {
        position: relative;
        overflow-x: hidden;
      }
      .chip-group:not(#monthChips) {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 140px));
        justify-content: flex-start;
        gap: 8px;
        margin-top: 8px;
      }
      .chip {
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        opacity: 0.7;
        transition:
          background 0.2s var(--ios-ease),
          opacity 0.2s var(--ios-ease);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: auto;
        justify-content: center;
        min-width: 72px;
      }
      #monthChips {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        padding-bottom: 4px;
        margin-top: 8px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
      }
      #monthChips .chip {
        flex: 0 0 auto;
        white-space: nowrap;
        scroll-snap-align: start;
        max-width: max-content;
      }

      #categoryChips,
      #walletChips {
        display: flex;
        flex-direction: row;
        width: 100%;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      #categoryDropdown {
        display: none;
      }

      #monthChips::-webkit-scrollbar {
        display: none;
      }

      #categoryChips {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        margin-top: 10px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
      }

      #categoryChips .chip {
        flex: 0 0 auto;
        white-space: nowrap;
        scroll-snap-align: start;
        max-width: max-content;
        padding: 12px 22px;
      }

      #categoryChips::-webkit-scrollbar {
        display: none;
      }

      #dateFilters {
        margin-bottom: 6px;
      }

      #categoryChips {
        margin-top: 10px;
      }

      #walletChips {
        margin-top: 10px;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
      }

      #walletChips .chip {
        flex: 0 0 auto;
        white-space: nowrap;
        scroll-snap-align: start;
        max-width: max-content;
        padding: 6px 12px;
      }

      #walletChips::-webkit-scrollbar {
        display: none;
      }
      #monthChips .chip.active {
        background: rgba(37, 99, 235, 0.2);
        color: #93c5fd;
      }
      #categoryChips .chip {
        font-size: 12px;
        opacity: 0.7;
      }

      #walletChips .chip {
        padding: 12px 22px;
        font-size: 12px;
        opacity: 0.6;
      }

      #categoryChips .chip.active,
      #walletChips .chip.active {
        opacity: 1;
      }
      .chip:hover {
        opacity: 0.9;
      }
      .chip.active {
        background: var(--accent);
        color: white;
        opacity: 1;
        transform: none;
      }
      .chip:active {
        transform: scale(0.95);
      }
      /* ===== KEYPAD CLEAN ===== */

      .keypad-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 100%;
      }

      .keypad-btn {
        padding: 18px 0;
        font-size: 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        transition: all 0.15s var(--ios-ease);
        width: 100%;
      }

      .keypad-btn:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.1);
      }

      /* operator beda visual */
      .keypad-btn.operator {
        background: rgba(37, 99, 235, 0.15);
        color: #93c5fd;
      }

      /* tombol utama */
      .keypad-btn.equal {
        background: var(--accent);
        color: white;
        font-weight: 600;
        grid-column: span 4;
        padding: 18px 0;
      }

      /* display lebih tegas */
      #keypadDisplay {
        font-size: 26px !important;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #categoryButtons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }
      #categoryButtons button {
        width: auto;
        padding: 12px 20px;
        border-radius: 999px;
        font-size: 13px;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.04);
        opacity: 0.7;
        text-align: center;
        transition: all 0.15s var(--ios-ease);
      }
      #categoryButtons button:hover {
        opacity: 0.9;
      }
      #categoryButtons button:active {
        transform: scale(0.95);
      }
      /* ===== WALLET BUTTONS ===== */

      #walletButtons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      #walletButtons button {
        width: 100%;
        padding: 12px 0;
        border-radius: 999px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.04);
        opacity: 0.7;
        text-align: center;
        transition: all 0.15s var(--ios-ease);
      }

      #walletButtons button:hover {
        opacity: 0.9;
      }

      #walletButtons button:active {
        transform: scale(0.95);
      }

      #walletButtons button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      #editWalletButtons button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      /* mobile */
      @media (max-width: 480px) {
        #walletButtons {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      /* ===== TRANSFER WALLET ===== */

      .wallet-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .wallet-grid button {
        width: 100%;
        padding: 12px 0;
        border-radius: 999px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.04) !important;
        color: var(--text-primary) !important;
        opacity: 0.6;
        text-align: center;
        transition: all 0.15s var(--ios-ease);
      }

      .wallet-grid button.active {
        background: var(--accent) !important;
        color: white !important;
        opacity: 1;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.6);
        transform: scale(1.03);
      }
      /* ===== WALLET SUMMARY ===== */

      .wallet-card {
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        font-size: 13px;
        line-height: 1.4;
        transition: all 0.2s var(--ios-ease);
      }

      .wallet-card b {
        display: block;
        margin-top: 4px;
        font-size: 18px;
        font-weight: 600;
      }

      .wallet-card:active {
        transform: scale(0.97);
      }
      #history {
        max-width: 900px;
        margin: 0 auto;
      }
      @media (max-width: 480px) {
        #categoryButtons {
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          gap: 8px;
          -webkit-overflow-scrolling: touch;
          scroll-snap-type: x mandatory;
          padding-left: 4px;
          padding-right: 4px;
        }

        #categoryButtons button {
          flex: 0 0 auto;
          white-space: nowrap;
          scroll-snap-align: start;
          padding: 10px 16px;
          font-size: 12px;
          border-radius: 999px;
        }

        #categoryDropdown {
          display: none !important;
        }
      }
      .chip.active {
        animation: chipPop 0.2s var(--ios-ease);
      }

      @keyframes chipPop {
        0% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }
      .history-item:active {
        transform: scale(0.98);
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div
        id="walletSummary"
        style="
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          margin-bottom: 16px;
        "

    <script>
      const URL =
        "https://script.google.com/macros/s/AKfycbyPwNHS1CzeNWNiPjvrRFy4z02DsKMSlTXqF72s7F5N_aCCqq8dEqyXCt_VCHBBUWpM/exec";
      let dataGlobal = [];
      let editMode = false;
      let editIndex = null;
      let currentDateFilter = "today";
      let selectedCustomDate = null;
      let selectedMonth = null; // format: YYYY-MM
      let sortMode = "desc"; // desc = terbaru di atas
      let currentCategoryFilter = "all";
      let currentWalletFilter = "all";
      let renderedIds = new Set();
      let syncQueue = JSON.parse(localStorage.getItem("syncQueue") || "[]");
      // Store original edit timestamp for edit modal
      let originalEditTanggal = null;
      let isLoadingData = true;
      let isTransactionAnimation = false;

      let skipNextBalanceAnimation = false;

      // Centralized state and DOM cache
      const state = {
        type: "expense",
        wallet: "cash",
        category: "food",
        filter: { date: "today", category: "all", search: "" },
      };

      const el = {
        wallet: document.getElementById("wallet"),
        category: document.getElementById("category"),
        date: document.getElementById("date"),
        history: document.getElementById("history"),
        amount: document.getElementById("amount"),
      };

      function parseNumber(val) {
        return Number(String(val || "").replace(/\./g, "")) || 0;
      }
      function processSyncQueue() {
        if (!syncQueue.length) return;

        const item = syncQueue[0];

        fetchWithTimeout(URL, {
          method: "POST",
          body: new URLSearchParams(item),
        })
          .then((res) => res.text())
          .then(() => {
            syncQueue.shift();
            localStorage.setItem("syncQueue", JSON.stringify(syncQueue));
            processSyncQueue(); // process next
          })
          .catch(() => {
            // retry later
            setTimeout(processSyncQueue, 5000);
          });
      }
      function fetchWithTimeout(url, options = {}, timeout = 15000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);

        return fetch(url, { ...options, signal: controller.signal }).finally(
          () => clearTimeout(id),
        );
      }

      function highlightText(text, keyword) {
        if (!keyword) return text;
        const regex = new RegExp(`(${keyword})`, "gi");
        return text.replace(regex, `<span class="highlight">$1</span>`);
      }

      // Format date to Indonesian format (e.g., 8 Agustus 2026, 23.00)
      function formatTanggal(dateStr) {
        const d = safeDate(dateStr);
        if (!d) return "-";

        const bulan = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        const tanggal = d.getDate();
        const bulanText = bulan[d.getMonth()];
        const tahun = d.getFullYear();

        let jam = d.getHours().toString().padStart(2, "0");
        let menit = d.getMinutes().toString().padStart(2, "0");

        return `${tanggal} ${bulanText} ${tahun}, ${jam}.${menit}`;
      }

      // Format date for display with day name (fixed: avoid timezone shift)
      function formatDateDisplay(val) {
        if (!val) return "-";

        const d = safeDate(val);
        if (!d) return "-";

        const hari = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];

        const bulan = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        return `${hari[d.getDay()]}, ${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
      }
      // Human-readable relative time
      function formatRelative(dateStr) {
        const now = new Date();
        const d = safeDate(dateStr);
        if (!d) return "-";

        const diffMs = now - d;
        const diffMinutes = Math.floor(diffMs / (1000 * 60));
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

        if (diffMinutes < 1) return "Just now";
        if (diffMinutes < 60) return `${diffMinutes} min ago`;
        if (diffHours < 24) return `${diffHours} hr ago`;

        if (diffDays === 0) return "Today";
        if (diffDays === 1) return "Yesterday";
        if (diffDays < 7) return `${diffDays} days ago`;

        return formatTanggal(dateStr);
      }

      // setMood removed

      function setEditMood(val, el) {
        function setEditFromWallet(val, el) {
          document.getElementById("editFromWallet").value = val;
          document
            .querySelectorAll("#editFromWalletButtons button")
            .forEach((b) => b.classList.remove("active"));
          el.classList.add("active");
        }

        function setEditToWallet(val, el) {
          document.getElementById("editToWallet").value = val;
          document
            .querySelectorAll("#editToWalletButtons button")
            .forEach((b) => b.classList.remove("active"));
          el.classList.add("active");
        }
        document.getElementById("editMood").value = val;
        document
          .querySelectorAll("#editMoodButtons button")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
      }

      function setDateFilter(type, el) {
        currentDateFilter = type;
        selectedMonth = null;
        // smart month visibility
        const monthEl = document.getElementById("monthChips");

        if (type === "today" || type === "week") {
          monthEl.style.display = "none";
        } else {
          monthEl.style.display = "flex";
        }
        document
          .querySelectorAll("#dateFilters button")
          .forEach((b) => b.classList.remove("active"));
        // Also clear month chips active state
        document
          .querySelectorAll("#monthChips .chip")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
        render();
        renderCategoryChips();
      }

      function setCategoryFilter(type, el) {
        currentCategoryFilter = type;

        // reset active hanya untuk kategori
        document
          .querySelectorAll("#categoryChips .chip")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");

        render();
      }

      function openCalendar() {
        document.getElementById("hiddenDate").showPicker?.() ||
          document.getElementById("hiddenDate").click();
      }

      function setCustomDate(val) {
        currentDateFilter = "custom";
        selectedCustomDate = val;
        document
          .querySelectorAll("#dateFilters button")
          .forEach((b) => b.classList.remove("active"));
        // Add active state for Calendar button
        const calendarBtn = [
          ...document.querySelectorAll("#dateFilters button"),
        ].find((b) => b.innerText.includes("Calendar"));
        if (calendarBtn) calendarBtn.classList.add("active");
        render();
        renderCategoryChips();
      }
      // Helper for local date string comparison
      function getLocalDateString(d) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      } // NOTE: backend must handle updateIndex to update row instead of append
      function buildPayload({
        judul,
        amount,
        type,
        wallet,
        category,
        fee,
        tanggal,
        fromWallet,
        toWallet,
      }) {
        const parsedAmount = parseNumber(amount);
        const parsedFee = parseNumber(fee || 0);

        const normalizedDate = safeDate(tanggal)
          .toLocaleString("sv-SE")
          .replace(" ", "T");

        return {
          judul,
          amount: parsedAmount,
          type,
          wallet: type === "transfer" ? "" : wallet,
          category: type === "transfer" ? "transfer" : category,
          fee: parsedFee,
          mood: "",
          tanggal: normalizedDate,
          fromWallet: fromWallet || "",
          toWallet: toWallet || "",
        };
      }
      function kirimData(e) {
        const judul = judulEl.value;
        let amount = el.amount.value;
        const type = document.getElementById("tabType").value;
        let wallet = el.wallet.value;
        // After tabType logic, ensure wallet is empty for transfer
        if (type === "transfer") {
          wallet = "";
          el.wallet.value = "";
        }
        document
          .querySelectorAll("#walletButtons button")
          .forEach((b) => b.classList.remove("active"));
        let category = el.category.value;
        if (type === "transfer") {
          category = "transfer";
        }
        let fee = document.getElementById("fee").value || 0;
        fee = parseNumber(fee);
        const mood = ""; // REMOVE moodEl, set to ""
        const dateInput = el.date.value;
        let date;

        // prevent duplicate rapid submit
        if (window.__sending) return;
        window.__sending = true;

        if (dateInput) {
          const selected = new Date(dateInput);
          date = selected.toLocaleString("sv-SE").replace(" ", "T");
        } else {
          date = new Date().toLocaleString("sv-SE").replace(" ", "T");
        }
        const fromWallet = document.getElementById("fromWallet")?.value || "";
        const toWallet = document.getElementById("toWallet")?.value || "";
        if (type === "transfer") {
          if (!fromWallet || !toWallet) {
            alert("Pilih wallet asal dan tujuan");
            window.__sending = false;
            return;
          }
          if (fromWallet === toWallet) {
            alert("Tidak bisa transfer ke wallet yang sama");
            window.__sending = false;
            return;
          }
        }
        amount = parseNumber(amount);
        if (!amount || Number(amount) <= 0) {
          const btn = e.target;
          btn.classList.remove("btn-loading");
          btn.innerText = "Save Entry";
          alert("Amount tidak valid");
          window.__sending = false;
          return;
        }
        const btn = e.target;
        if (btn.classList.contains("btn-loading")) {
          window.__sending = false;
          return;
        }
        btn.classList.add("btn-loading");
        btn.disabled = true;
        btn.innerText = editMode ? "Updating..." : "Saving...";

        const tempItem = {
          id: "temp-" + Date.now(),
          judul,
          amount,
          type,
          wallet,
          category,
          fee,
          mood,
          tanggal: date,
          fromWallet,
          toWallet,
        };

        const payloadData = buildPayload({
          judul,
          amount,
          type,
          wallet,
          category,
          fee,
          tanggal: date,
          fromWallet,
          toWallet,
        });

        const payload = {
          clientId:
            (judul || "") +
            "-" +
            payloadData.amount +
            "-" +
            payloadData.tanggal,
          action: "insert",
          ...payloadData,
        };

        // Log payload before fetch
        console.log("SEND PAYLOAD:", payload);

        /* --- smooth pre-animation for balance change --- */
        try {
          const balancesBefore = calculateBalances(dataGlobal);
          const totalBefore =
            (balancesBefore.bca || 0) +
            (balancesBefore.gopay || 0) +
            (balancesBefore.dana || 0) +
            (balancesBefore.cash || 0);

          let delta = payloadData.amount || 0;

          if (payloadData.type === "expense") delta = -delta;
          if (payloadData.type === "transfer") delta = 0;

          const targetTotal = totalBefore + delta;

          // animate from current DOM value instead of jumping
          const elBalance = document.getElementById("topBalance");
          const currentText = elBalance.innerText.replace(/[^\d]/g, "");
          const currentVal = Number(currentText) || totalBefore;

          isTransactionAnimation = true;

          setTimeout(() => {
            animateNumber(elBalance, targetTotal, "Balance: Rp ", 1200);

            // reset setelah animasi selesai
            setTimeout(() => {
              isTransactionAnimation = false;
            }, 1800);
          }, 80);
        } catch (e) {}

        // prevent accidental double fire
        const payloadKey = JSON.stringify(payload);
        if (window.__lastPayload === payloadKey) {
          window.__sending = false;
          return;
        }
        window.__lastPayload = payloadKey;

        fetchWithTimeout(URL, {
          method: "POST",
          body: new URLSearchParams(payload),
        })
          .then((res) => res.text())
          .then((res) => {
            const cleanRes = (res || "").toString().trim();

            if (!cleanRes || cleanRes.toLowerCase().includes("error")) {
              throw new Error("Server error");
            }

            // ALWAYS reset sending + button first
            window.__sending = false;
            btn.classList.remove("btn-loading");
            btn.disabled = false;

            editMode = false;

            btn.classList.add("button-success");
            btn.innerText = "Saved";
            btn.style.transform = "scale(1.05)";
            setTimeout(() => {
              btn.style.transform = "scale(1)";
            }, 150);

            setTimeout(() => {
              btn.classList.remove("button-success");
              btn.innerText = "Save Entry";
            }, 200);

            document.getElementById("status").innerText = "Nice. Keep going.";
            showToast();

            clearTimeout(window.__reloadTimer);
            window.__lastPayload = null;
            window.__reloadTimer = setTimeout(loadData, 1200);
          })
          .catch((err) => {
            console.warn("Request issue but may still succeed:", err);

            // ALWAYS reset state
            window.__sending = false;
            btn.classList.remove("btn-loading");
            btn.disabled = false;
            window.__lastPayload = null;

            // queue for retry
            syncQueue.push(payload);
            localStorage.setItem("syncQueue", JSON.stringify(syncQueue));

            clearTimeout(window.__reloadTimer);
            window.__reloadTimer = setTimeout(loadData, 1200);
          });

        // Final failsafe: reset sending/button state after 5s in case of stuck
        setTimeout(() => {
          window.__sending = false;
          btn.disabled = false;
          btn.classList.remove("btn-loading");
        }, 5000);
      }

      function calculateStats(data) {
        let income = 0;
        let expense = 0;

        data.forEach((item) => {
          const amt = Number(item.amount) || 0;

          const type = (item.type || "").toLowerCase();

          if (type === "income") income += amt;
          if (type === "expense") expense += amt;
        });

        return { income, expense };
      }

      function calculateBalances(data) {
        const balances = { bca: 0, gopay: 0, dana: 0, cash: 0 };

        data.forEach((item) => {
          const amt = Number(item.amount) || 0;
          const fee = Number(item.fee) || 0;

          const w = (item.wallet || "").toLowerCase();
          const from = (item.fromWallet || "").toLowerCase();
          const to = (item.toWallet || "").toLowerCase();

          if (item.type === "income" && balances[w] !== undefined) {
            balances[w] += amt;
          }

          if (item.type === "expense" && balances[w] !== undefined) {
            balances[w] -= amt;
          }

          if (item.type === "transfer") {
            if (balances[from] !== undefined) balances[from] -= amt + fee;
            if (balances[to] !== undefined) balances[to] += amt;
          }
        });

        return balances;
      }

      function filterData(data) {
        const search = searchEl.value.toLowerCase();

        return data.filter((item) => {
          // Wallet filter
          if (currentWalletFilter !== "all") {
            const w = (item.wallet || "").toLowerCase();
            const from = (item.fromWallet || "").toLowerCase();
            const to = (item.toWallet || "").toLowerCase();

            if (
              w !== currentWalletFilter &&
              from !== currentWalletFilter &&
              to !== currentWalletFilter
            ) {
              return false;
            }
          }

          if (
            currentCategoryFilter !== "all" &&
            item.category !== currentCategoryFilter
          ) {
            return false;
          }

          if (
            search &&
            !(item.judul || "").toLowerCase().includes(search) &&
            !String(item.amount || "").includes(search)
          ) {
            return false;
          }

          const d = safeDate(item.tanggal);
          const now = new Date();
          if (!d) return false;

          if (currentDateFilter === "today") {
            return getLocalDateString(d) === getLocalDateString(now);
          }

          if (currentDateFilter === "week") {
            return (now - d) / (1000 * 60 * 60 * 24) <= 7;
          }

          if (currentDateFilter === "month") {
            return (
              d.getMonth() === now.getMonth() &&
              d.getFullYear() === now.getFullYear()
            );
          }

          if (currentDateFilter === "custom" && selectedCustomDate) {
            return getLocalDateString(d) === selectedCustomDate;
          }

          if (currentDateFilter === "monthCustom" && selectedMonth) {
            const [year, month] = selectedMonth.split("-");
            return (
              d.getFullYear() === Number(year) &&
              d.getMonth() === Number(month) - 1
            );
          }

          return true;
        });
      }

      function saveEdit() {

        let amount = document.getElementById("editAmount").value || "";
        let wallet = document.getElementById("editWallet").value;

        if (type === "transfer") {
          wallet = "";
        }
        const category =
          type === "transfer"
            ? "transfer"
            : document.getElementById("editCategory").value;
        const fee = document.getElementById("editFee").value || 0;
        const mood = "";
        // ----- REPLACEMENT BLOCK START -----
        let tanggalInput = originalEditTanggal || new Date();

        const payloadData = buildPayload({
          judul,
          amount,
          type,
          wallet,
          category,
          fee,
          tanggal: tanggalInput,
          fromWallet: document.getElementById("editFromWallet")?.value,
          toWallet: document.getElementById("editToWallet")?.value,
        }); // ----- REPLACEMENT BLOCK END -----
        // Replace amount validation:
        const parsedAmount = parseNumber(amount);
        if (!parsedAmount || parsedAmount <= 0) {
          alert("Amount tidak valid");
          return;
        }
        // Insert transfer validation BEFORE fetch call
        if (type === "transfer") {
          if (!payloadData.fromWallet || !payloadData.toWallet) {
            alert("Pilih wallet asal dan tujuan");

        document
          .querySelector("#dateFilters button:first-child")
          .classList.add("active");
        render();
      }

      function toggleSort() {
        sortMode = sortMode === "desc" ? "asc" : "desc";
        document.getElementById("sortBtn").innerText =
          sortMode === "desc" ? "Newest First ↓" : "Oldest First ↑";
        render();
      }

      let searchTimer;
      searchEl.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(render, 300);
      });
      function setType(val, el) {
        document.getElementById("type").value = val;
        document
          .querySelectorAll("#typeButtons button")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
      }
      function setEditType(val, el) {
        document.getElementById("editType").value = val;
        document
          .querySelectorAll("#editTypeButtons button")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
      }

      // New transaction tab/category/wallet/keypad logic
      function setTab(type, el) {
        document.getElementById("tabType").value = type;

        document
          .querySelectorAll("#tabs .tab")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
        const commonFields = document.getElementById("commonFields");
        const transferFields = document.getElementById("transferFields");

        if (type === "transfer") {
          commonFields.style.display = "none";
          transferFields.style.display = "block";

          // force category to transfer
          document.getElementById("category").value = "transfer";
        } else {
          commonFields.style.display = "block";
          transferFields.style.display = "none";

          // reset category to default
          renderCategories(type, "categoryButtons");
        }
      }

      function renderCategories(
        type = "expense",
        containerId = "categoryButtons",
        active = "",
      ) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const expenseCategories = [
          "food",
          "transport",
          "household",
          "social",
          "apparel",
          "education",
          "gift",
          "production",
          "other",
        ];

        const incomeCategories = ["salary", "other"];

        const list = type === "income" ? incomeCategories : expenseCategories;

        container.innerHTML = list
          .map(
            (c) => `
    <button data-value="${c}" class="${c === (active || "").toLowerCase() ? "active" : ""}"
      onclick="setCategoryUnified('${c}', this, '${containerId}')">
      ${c.charAt(0).toUpperCase() + c.slice(1)}
    </button>
  `,
          )
          .join("");

        const val = active || list[0];

        setTimeout(() => {
          const buttons = container.querySelectorAll("button");

          // ensure correct active based on value
          const target = (active || list[0]).toLowerCase();

          buttons.forEach((b) => {
            if ((b.dataset.value || "").toLowerCase() === target) {
              b.classList.add("active");
            } else {
              b.classList.remove("active");
            }
          });

          // auto scroll into view (for edit chips)
          if (containerId === "editCategoryChips") {
            const activeEl = container.querySelector(".active");
            if (activeEl) {
              activeEl.scrollIntoView({
                behavior: "smooth",
                inline: "center",
                block: "nearest",
              });
            }
          }
        }, 0);

        if (containerId === "categoryButtons") {
          document.getElementById("category").value = val;
        } else if (containerId === "editCategoryChips") {
          document.getElementById("editCategory").value = val;
        }
      }
      function setCategoryUnified(val, el, containerId) {
        if (containerId === "categoryButtons") {
          document.getElementById("category").value = val;
        } else if (containerId === "editCategoryChips") {
          document.getElementById("editCategory").value = val;
        }

        document
          .querySelectorAll(`#${containerId} button`)
          .forEach((b) => b.classList.remove("active"));

        if (el) el.classList.add("active");
      }
      function setCategory(val, el) {
        document.getElementById("category").value = val;

        document
          .querySelectorAll("#categoryButtons button")
          .forEach((b) => b.classList.remove("active"));

        if (el) el.classList.add("active");

        // sync dropdown
        const dropdown = document.getElementById("categoryDropdown");
        if (dropdown) dropdown.value = val;
      }
      function setWallet(val, elBtn) {
        state.wallet = val;
        el.wallet.value = val;

        document
          .querySelectorAll("#walletButtons button")
          .forEach((b) => b.classList.remove("active"));

        elBtn.classList.add("active");
      }
      function setFromWallet(val, el) {
        const toVal = document.getElementById("toWallet").value;

        // prevent same selection
        if (val === toVal) return;

        document.getElementById("fromWallet").value = val;

        const container = el.closest(".wallet-grid");
        container
          .querySelectorAll("button")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");
      }

      function setToWallet(val, el) {
        const fromVal = document.getElementById("fromWallet").value;

        // prevent same selection
        if (val === fromVal) return;

        document.getElementById("toWallet").value = val;

        const container = el.closest(".wallet-grid");
        container
          .querySelectorAll("button")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");
      }

      // --- Custom Keypad Modal ---
      let currentKeypadField = null;
      let keypadValue = "";
      let keypadExpression = "";

      function openKeypad(fieldId) {
        currentKeypadField = fieldId;

        // reset state to avoid cross-field leakage
        keypadValue = "";
        keypadExpression = "";

        updateKeypadDisplay();
        document.getElementById("keypadModal").style.display = "block";
      }

      function keypadInput(val) {
        const btn = event?.target;
        if (btn) {
          btn.style.transform = "scale(0.92)";
          setTimeout(() => {
            btn.style.transform = "scale(1)";
          }, 100);
        }
        keypadExpression += val;
        updateKeypadDisplay();
      }

      function updateKeypadDisplay() {
        const parts = keypadExpression.split(/([+\-*/])/);

        const formatted = parts
          .map((part) => {
            if (/^[+\-*/]$/.test(part)) return ` ${part} `;
            const num = part.replace(/\D/g, "");
            return num ? Number(num).toLocaleString("id-ID") : "";
          })
          .join("")
          .trim();

        document.getElementById("keypadDisplay").innerText = formatted || "0";
      }

      function keypadOperator(op) {
        if (!keypadExpression) return; // prevent starting with operator

        const lastChar = keypadExpression.slice(-1);
        if (/[+\-*/]/.test(lastChar)) {
          // replace last operator instead of stacking
          keypadExpression = keypadExpression.slice(0, -1) + op;
        } else {
          keypadExpression += op;
        }

        updateKeypadDisplay();
      }

      function keypadEqual() {
        if (!/^[0-9+\-*/ ]+$/.test(keypadExpression)) {
          keypadExpression = "";
          document.getElementById("keypadDisplay").innerText = "Error";
          return;
        }
        try {
          const result = Function(
            `"use strict"; return (${keypadExpression})`,
          )();

          if (!isFinite(result)) throw new Error();

          keypadExpression = String(Math.floor(result));
          updateKeypadDisplay();
        } catch {
          keypadExpression = "";
          document.getElementById("keypadDisplay").innerText = "Error";
        }
      }

      function keypadClear() {
        keypadExpression = "";
        document.getElementById("keypadDisplay").innerText = "0";
      }

      function keypadBackspace() {
        keypadExpression = keypadExpression.slice(0, -1);
        updateKeypadDisplay();
      }

      function keypadDone() {
        if (currentKeypadField) {
          const num = keypadExpression.replace(/[^0-9]/g, "");
          const formatted = num ? Number(num).toLocaleString("id-ID") : "";
          document.getElementById(currentKeypadField).value = formatted;
        }
        document.getElementById("keypadModal").style.display = "none";

        // clear state after use
        keypadExpression = "";
        keypadValue = "";
        currentKeypadField = null;
      }
      function openDatePicker() {
        const input = document.getElementById("date");
        if (input.showPicker) {
          input.showPicker();
        } else {
          input.focus();
          input.click();
        }
      }
      document.getElementById("date").addEventListener("change", function () {
        document.getElementById("dateDisplay").innerText = formatDateDisplay(
          this.value,
        );
      });
      function renderCategoryChips() {
        const container = document.getElementById("categoryChips");

        // Ambil data sesuai filter tanggal + wallet (tanpa filter kategori)
        const prevCategory = currentCategoryFilter;
        currentCategoryFilter = "all";

        const filtered = filterData(dataGlobal);

        currentCategoryFilter = prevCategory;

        const categories = new Set();

        filtered.forEach((item) => {
          if (item.category) categories.add(item.category);
        });

        const list = ["all", ...Array.from(categories)];

        // auto-hide if only 'all' or 1 category
        if (list.length <= 2) {
          container.style.display = "none";
          return;
        } else {
          container.style.display = "flex";
        }

        container.innerHTML = list
          .map(
            (c) => `
                    <button class="chip ${c === currentCategoryFilter ? "active" : ""}" onclick="setCategoryFilter('${c}', this)">
                      ${c === "all" ? "All" : c}
                    </button>
                  `,
          )
          .join("");
      }
      function setEditTab(type, el) {
        document.getElementById("editType").value = type;

        document
          .querySelectorAll("#editTabs .tab")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");

        const common = document.getElementById("editCommonFields");
        const transfer = document.getElementById("editTransferFields");

        if (type === "transfer") {
          common.style.display = "none";
          transfer.style.display = "block";
        } else {
          common.style.display = "block";
          transfer.style.display = "none";
        }

        // render ulang kategori (PENTING)
        renderCategories(type, "editCategoryChips");
      }
      function renderWalletChips() {
        const container = document.getElementById("walletChips");
        const wallets = new Set();

        const prevWallet = currentWalletFilter;
        currentWalletFilter = "all";

        const filtered = filterData(dataGlobal);

        currentWalletFilter = prevWallet;

        filtered.forEach((item) => {
          if (item.wallet) wallets.add(item.wallet);
          if (item.fromWallet) wallets.add(item.fromWallet);
          if (item.toWallet) wallets.add(item.toWallet);
        });

        const list = ["all", ...Array.from(wallets)];

        if (list.length <= 1) {
          container.style.display = "none";
          return;
        } else {
          container.style.display = "flex";
        }

        if (!list.includes(currentWalletFilter)) {
          currentWalletFilter = "all";
        }

        container.innerHTML = list
          .map(
            (w) => `
        <button class="chip ${w === currentWalletFilter ? "active" : ""}" onclick="setWalletFilter('${w}', this)">
          ${w === "all" ? "All Wallet" : w}
        </button>
      `,
          )
          .join("");
      }

      function setWalletFilter(val, el) {
        currentWalletFilter = val;

        document
          .querySelectorAll("#walletChips .chip")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");

        render();
      }
      // Safe date parse utility
      function safeDate(str) {
        if (!str) return new Date();

        const s = String(str).trim();

        if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
          return new Date(s.replace(" ", "T"));
        }

        if (/^\d{2}\/\d{2}\/\d{4}/.test(s)) {
          const [datePart, timePart] = s.split(" ");
          const [d, m, y] = datePart.split("/");
          return new Date(`${y}-${m}-${d}${timePart ? "T" + timePart : ""}`);
        }

        const fallback = new Date(s);
        return isNaN(fallback) ? new Date() : fallback;
      }

      // Overlay click-to-close for keypad
      function handleKeypadOverlayClick(e) {
        // close only if clicking outside keypad panel
        if (e.target.id === "keypadModal") {
          document.getElementById("keypadModal").style.display = "none";

          keypadExpression = "";
          keypadValue = "";
          currentKeypadField = null;
        }
      }
      function renderMonthChips() {
        const container = document.getElementById("monthChips");
        const months = new Set();

        dataGlobal.forEach((item) => {
          const d = safeDate(item.tanggal);
          if (!d) return;

          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          months.add(key);
        });

        const list = Array.from(months).sort().reverse();

        container.innerHTML = list
          .map((m) => {
            const [y, mo] = m.split("-");
            const label = new Date(y, mo - 1).toLocaleString("en-US", {
              month: "short",
            });

            return `
              <button class="chip ${m === selectedMonth ? "active" : ""}"
                onclick="setMonthFilter('${m}', this)">
                ${label} ${y}
              </button>
            `;
          })
          .join("");
      }
      function setMonthFilter(val, el) {
        document.getElementById("monthChips").style.display = "flex";

        selectedMonth = val;
        currentDateFilter = "monthCustom";
        document
          .querySelectorAll("#monthChips .chip")
          .forEach((b) => b.classList.remove("active"));

        el.classList.add("active");

        // reset tombol filter lain
        document
          .querySelectorAll("#dateFilters button")
          .forEach((b) => b.classList.remove("active"));

        render();
        renderCategoryChips();
      }
      function setEditCategory(val, el) {
        document.getElementById("editCategory").value = val;

        document
          .querySelectorAll("#editCategoryChips .chip")
          .forEach((b) => b.classList.remove("active"));

        if (el) el.classList.add("active");
      }
      function setEditWallet(val, el) {
        document.getElementById("editWallet").value = val;

        document
          .querySelectorAll("#editWalletButtons button")
          .forEach((b) => b.classList.remove("active"));

        if (el) el.classList.add("active");
      }
      function animateNumber(el, target, prefix = "") {
        const duration = 900; // ms (fast)
        const currentText = el.innerText || "";
        const currentNumber = Number(currentText.replace(/[^\d]/g, "")) || 0;
        const start = currentNumber;
        const startTime = performance.now();

        function update(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = Math.floor(start + (target - start) * eased);

          el.innerText = prefix + value.toLocaleString();

          // warna naik / turun
          if (isTransactionAnimation) {
            if (target > start) {
              el.style.color = "#60a5fa"; // naik
            } else if (target < start) {
              el.style.color = "#f87171"; // turun
            } else {
              el.style.color = "";
            }
          } else {
            el.style.color = "";
          }
          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            el.innerText = `${prefix}${target.toLocaleString()}`;

            // penting: jangan reset warna kalau transaksi
            if (!isTransactionAnimation) {
              el.style.color = "";
            }
          }
        }

        requestAnimationFrame(update);
      }
    </script>
