<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAS Valorant • Ujian Akhir Season Valorant</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="/uas/style.css?v=20260529-4" />
    <link rel="icon" type="image/x-icon" href="/img/icon.jpg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
    />
  </head>
  <body>
    <main class="container">
      <section class="uas-card" id="introPanel">
        <h2>UAS Valorant</h2>
        <p class="intro-subtitle">Ujian Akhir Season Valorant</p>
        <p class="intro-note">Donate min 10k untuk mulai ujian.</p>
        <button class="primary-button" id="openStart" type="button">
          <i class="ri-graduation-cap-line"></i>
          Mulai Ujian
        </button>
      </section>

      <section class="leaderboard-panel" id="leaderboardPanel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Highscore</p>
          </div>
          <button class="icon-button" id="refreshLeaderboard" type="button">
            <i class="ri-refresh-line"></i>
          </button>
        </div>
        <div class="leaderboard" id="leaderboard">
          <div class="loading-row">Memuat highscore...</div>
        </div>
      </section>

      <form class="start-card hidden" id="startForm">
        <div class="section-head">
          <div>
            <p class="eyebrow">Daftar Ujian</p>
          </div>
          <span class="minimum-pill">min. 10k</span>
        </div>

        <label>
          <span>Nama</span>
          <input
            id="nameInput"
            name="name"
            autocomplete="name"
            maxlength="40"
            placeholder="Nama di highscore"
            required
          />
        </label>

        <label>
          <span>Email</span>
          <input
            id="emailInput"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="nama@gmail.com"
            required
            type="email"
          />
        </label>

        <label>
          <span>Donate seikhlasnya</span>
          <div class="amount-control">
            <span>Rp</span>
            <input
              id="amountInput"
              name="amount"
              inputmode="numeric"
              min="10000"
              placeholder="10000"
              required
              step="1000"
              type="number"
              value="10000"
            />
          </div>
        </label>

        <div class="amount-presets" aria-label="Pilihan nominal donasi">
          <button class="is-selected" data-amount="10000" type="button">
            10k
          </button>
          <button data-amount="25000" type="button">25k</button>
          <button data-amount="50000" type="button">50k</button>
        </div>

        <button class="primary-button" type="submit">
          <i class="ri-bank-card-line"></i>
          Bayar via Midtrans
        </button>
        <p class="form-note" id="startMessage">
          Satu pembayaran untuk satu kali ujian.
        </p>
      </form>

      <section class="payment-card hidden" id="paymentPanel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Checkout</p>
          </div>
          <span class="status-pill" id="paymentStatus">Pending</span>
        </div>
        <div id="paymentInstructions"></div>
        <div class="payment-actions">
          <button class="primary-button" id="checkPayment" type="button">
            <i class="ri-search-eye-line"></i>
            Cek Status
          </button>
          <button class="ghost-button" id="changePayment" type="button">
            <i class="ri-arrow-left-right-line"></i>
            Ganti Metode
          </button>
          <button class="ghost-button hidden" id="localPreview" type="button">
            Preview lokal
          </button>
        </div>
        <p class="form-note" id="paymentMessage"></p>
      </section>

      <section class="exam-card hidden" id="examPanel">
        <div class="section-head">
          <div>
            <p class="eyebrow">Ruang Ujian</p>
          </div>
          <span class="progress-pill" id="progressPill">1/10</span>
        </div>

        <div class="question-card" id="questionCard"></div>
      </section>

      <section class="result-card hidden" id="resultPanel"></section>

      <footer class="site-footer" aria-label="Copyright">
        <picture>
          <source srcset="/img/icon.webp" type="image/webp" />
          <img src="/img/icon.jpg" alt="COKELAT MANIS" decoding="async" loading="lazy" />
        </picture>
        <div>
          <strong>COKELAT MANIS</strong>
          <span>&copy; 2026 @zkaofldk</span>
        </div>
      </footer>
    </main>

    <script src="/uas/script.js?v=20260529-4"></script>
  </body>
</html>
