<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jasa Mabar Valorant</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffd1dc;
        color: #4a1f33;
      }
      .container {
        width: 100%;
        max-width: 420px;
        padding: 32px 20px;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 28px 24px;
      }
      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff69b4, #ff85c1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 28px;
        margin: 0 auto 12px;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0;
        color: #b03060;
      }
      .subtitle {
        font-size: 14px;
        opacity: 0.9;
        margin-bottom: 16px;
      }
      .badge {
        display: inline-block;
        background: #ff69b4;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .price {
        background: rgba(255, 182, 193, 0.35);
        border-radius: 12px;
        padding: 14px;
        margin: 16px 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .links a {
        display: block;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #ff69b4, #ff85c1);
        padding: 14px;
        border-radius: 12px;
        margin: 10px 0;
        font-weight: bold;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }
      .links a.secondary {
        background: rgba(255, 182, 193, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .links a:hover {
        transform: scale(1.03);
        opacity: 0.9;
      }
      .description,
      .order {
        font-size: 13px;
        line-height: 1.6;
        margin: 14px 0;
        opacity: 0.95;
      }
      .main-button {
        display: block;
        margin-top: 18px;
        background: #ff69b4;
        color: #fff;
        padding: 14px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
      }
      .main-button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="avatar">🎮</div>
        <h1>Mabar Valorant Fun</h1>

        <p style="font-size: 15px; margin-bottom: 6px">
          Teman main santai & komunikasi
        </p>
        <p style="font-size: 14px; opacity: 0.85">
          Rank Bronze • Voice ON • Anti Toxic
        </p>

        <div class="price">
          💸 <strong>5k / 1 match</strong> (trial)<br />
          📦 <strong>50k / 1 bulan</strong> (hemat & santai)<br />
          💎 <strong>100k / 1 bulan</strong> (prioritas)
        </div>
        <p style="font-size: 12px; opacity: 0.7; margin-top: -8px">
          Paket 100k: prioritas jadwal & lebih fleksibel
        </p>

        <a
          href="https://saweria.co/USERNAMEKAMU"
          target="_blank"
          class="main-button"
        >
          Order via Saweria
        </a>

        <p style="font-size: 12px; opacity: 0.7; margin-top: 14px">
          Isi pesan Saweria:<br />
          Username | Rank | Jam main
        </p>
      </div>
    </div>
  </body>
</html>
